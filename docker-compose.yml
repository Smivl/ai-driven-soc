# Local Postgres for the SOC backend (tenant registry + settings).
#   docker compose up -d
services:
  postgres:
    image: postgres:16
    container_name: soc-postgres
    environment:
      POSTGRES_USER: soc
      POSTGRES_PASSWORD: soc
      POSTGRES_DB: soc
    ports:
      - "5432:5432"
    volumes:
      - soc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soc -d soc"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  soc_pgdata:
